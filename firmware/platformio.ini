; Kivo Deck firmware — ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB OPI PSRAM)
; Arduino core 3.0.7 via the pioarduino platform (the official PlatformIO platform only ships core 2.x).
[env:kivo-deck]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=0          ; USB-OTG (TinyUSB): HID keyboard + CDC serial on GPIO19/20
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lovyan03/LovyanGFX@1.2.7
