[package]
name = "kivo-deck"
version = "0.3.0"
description = "Kivo Deck PC app"
authors = ["Kivo Lab"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "kivo_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
enigo = "0.6.1"
sysinfo = "0.39.6"
obws = "0.15.0"
base64 = "0.23.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.0"
tauri-plugin-process = "2.4.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-single-instance = "2.5.4"
tokio = { version = "1.54.0", features = ["rt", "sync", "time"] }
ureq = "3.4.2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_ProcessStatus", "Win32_System_Performance", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Graphics_Dxgi", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem"] }
